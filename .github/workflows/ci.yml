name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/GameShell.Ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/GameShell.Ui
      - name: Test frontend
        run: npm test
        working-directory: src/GameShell.Ui
      - name: Build frontend and desktop from source
        shell: pwsh
        run: ./scripts/build.ps1 -SkipNpmInstall
      - name: Test .NET
        run: dotnet test tests/GameShell.Core.Tests/GameShell.Core.Tests.csproj --no-build --no-restore
