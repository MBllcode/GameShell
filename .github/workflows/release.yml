name: Publish Windows release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for secrets
        shell: pwsh
        run: ./scripts/check-secrets.ps1
      - name: Validate version tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'A semantic version tag such as v0.1.0 is required.'
          }
          "RELEASE_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/GameShell.Ui/package-lock.json
      - name: Install and test frontend
        shell: pwsh
        working-directory: src/GameShell.Ui
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }
      - name: Test backend
        run: dotnet test tests/GameShell.Core.Tests/GameShell.Core.Tests.csproj --verbosity minimal
      - name: Build portable Windows package
        shell: pwsh
        run: ./scripts/package.ps1 -SkipNpmInstall -NoLaunch -Version $env:RELEASE_VERSION
      - name: Create EXE and ZIP
        shell: pwsh
        run: ./scripts/create-release-assets.ps1 -Version $env:RELEASE_VERSION
      - name: Publish release after successful verification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const prerelease = tag.includes('-');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              let body;
              try { body = await fs.readFile(`docs/releases/${tag}.md`, 'utf8'); }
              catch (error) { if (error.code !== 'ENOENT') throw error; }
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `GameShell ${tag}`,
                body, generate_release_notes: !body, draft: true, prerelease
              })).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id
            });
            for (const name of ['GameShell.exe', 'GameShell-win-x64.zip']) {
              const existing = assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              const data = await fs.readFile(path.join('artifacts', 'releases', version, name));
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': name.endsWith('.zip') ? 'application/zip' : 'application/octet-stream' }
              });
            }
            const published = (await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, prerelease,
              make_latest: prerelease ? 'false' : 'true'
            })).data;
            await core.summary.addHeading(`GameShell ${tag}`)
              .addLink('Release and downloads', published.html_url).write();
